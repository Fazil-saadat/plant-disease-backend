{% extends "base.html" %}

{% block content %}
<h1 class="dashboard-title">{{ t.dashboard }}</h1>

<div class="results-container">
    <div class="result-image-container">
        <div class="image-wrapper">
            <img id="resultImage"
                 alt="Scanned plant"
                 class="result-image"
                 onerror="handleImageError(this)">
        </div>

        <div class="confidence-score">
            {{ t.confidence }}:
            <span id="confidenceValue">0</span>%
        </div>
    </div>

    <div class="result-details">
        <h2 id="diseaseName" style="margin-bottom:1rem;color:var(--forest-green);">
            —
        </h2>

        <p id="plantType" style="margin-bottom:1.5rem;color:#666;">
            —
        </p>

        <div class="tabs">
            <button class="tab active" data-tab="overview">{{ t.overview }}</button>
            <button class="tab" data-tab="treatment">{{ t.treatment }}</button>
            <button class="tab" data-tab="prevention">{{ t.prevention }}</button>
        </div>

        <div id="overview" class="tab-content active">
            <h3>{{ t.disease_overview }}</h3>
            <p id="overviewText">—</p>
        </div>

        <div id="treatment" class="tab-content">
            <h3>{{ t.recommended_treatment }}</h3>
            <p id="treatmentText">—</p>
        </div>

        <div id="prevention" class="tab-content">
            <h3>{{ t.prevention_tips }}</h3>
            <p id="preventionText">—</p>
        </div>

        <div style="margin-top:2rem;display:flex;gap:1rem;">
            <button class="cta-button" onclick="window.location.href='/scan'">
                {{ t.scan_another }}
            </button>

            <button class="upload-button" id="saveResultBtn" onclick="saveResult()">
                {{ t.save_results }}
            </button>
        </div>

        <div id="saveStatus" style="margin-top:1rem;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentResult = null;

/* Image fallback */
function handleImageError(img) {
    img.src =
        'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjMwMCI+PC9zdmc+';
    img.onerror = null;
}

/* Load result from localStorage */
function loadResultFromStorage() {
    const stored = localStorage.getItem('lastScanResult');

    if (!stored) {
        window.location.href = '/dashboard';
        return;
    }

    currentResult = JSON.parse(stored);

    document.getElementById('confidenceValue').textContent =
        currentResult.confidence ?? 0;

    document.getElementById('diseaseName').textContent =
        currentResult.disease || currentResult.disease_name || 'Unknown Disease';

    let plantType = 'Unknown';

if (currentResult.plant_type) {
    plantType = currentResult.plant_type;
} 
else if (
    currentResult.prediction &&
    currentResult.prediction.includes('___')
) {
    plantType = currentResult.prediction.split('___')[0];
}

document.getElementById('plantType').textContent =
    '{{ t.detected_in }} ' + plantType;


    document.getElementById('overviewText').textContent =
        currentResult.symptoms || currentResult.description || '—';

    document.getElementById('treatmentText').textContent =
        currentResult.treatment || '—';

    document.getElementById('preventionText').textContent =
        currentResult.prevention || '—';

    if (currentResult.uploaded_image) {
        document.getElementById('resultImage').src =
            currentResult.uploaded_image;
    }
}

/* Save result */
async function saveResult() {
    if (!currentResult) return;

    const btn = document.getElementById('saveResultBtn');
    const status = document.getElementById('saveStatus');

    btn.disabled = true;
    btn.innerHTML = '{{ t.saving }}...';

    try {
        const res = await fetch('/save-result', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentResult)
        });

        const data = await res.json();

        if (data.status === 'success') {
            status.innerHTML =
                '<div class="alert alert-success">{{ t.result_saved }}</div>';
            localStorage.removeItem('lastScanResult');
            btn.style.display = 'none';
        } else {
            throw new Error(data.message);
        }
    } catch (e) {
        status.innerHTML =
            '<div class="alert alert-error">' + e.message + '</div>';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '{{ t.save_results }}';
    }
}

/* Tabs + load */
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    loadResultFromStorage();
});
</script>
{% endblock %}
